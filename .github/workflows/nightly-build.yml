name: nightly-build

on:
  schedule:
    - cron: "0 17 * * *" # JST 02:00
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, chromium-builder]
    timeout-minutes: 360
    permissions:
      issues: write
    env:
      CHROMIUM_SRC: /workspaces/chromium/src
      CHROMIUM_CONFIG_DIR: ${{ github.workspace }}/config
    steps:
      - uses: actions/checkout@v4

      - name: gclient sync
        run: cd $CHROMIUM_SRC && gclient sync -D --force

      - name: Sync overlay + apply patches
        run: |
          python3 build/sync_overlay.py
          python3 build/apply_patches.py

      - name: GN gen
        run: |
          cd $CHROMIUM_SRC
          gn gen out/Default --args="$(cat ${CHROMIUM_CONFIG_DIR}/gn_args.gn)"

      - name: Build overlay unit tests
        run: cd $CHROMIUM_SRC && autoninja -C out/Default multi_session_overlay_tests

      - name: Run unit tests
        run: bash build/run_unit_tests.sh

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = `[Alert] Nightly Build Failed (${new Date().toLocaleDateString('ja-JP')})`;
            const issueBody = `ナイトリービルドが失敗しました。\n詳細なログを確認してください: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['bug', 'nightly-build']
            });

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: ${{ env.CHROMIUM_SRC }}/out/Default/*.log
          retention-days: 7
